[project]
name = "retail-demand-forecasting-benchmark"
version = "0.1.0"
description = "Retail demand forecasting benchmark on M5 and Walmart: statistical baselines, LightGBM and deep models under one evaluation protocol"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ananth Shyam" }]
requires-python = ">=3.10"
keywords = ["forecasting", "time-series", "demand-forecasting", "m5", "benchmark"]
# Developed and tested with: numpy 2.2, pandas 2.3, scipy 1.15, scikit-learn 1.7,
# statsforecast 2.1, mlforecast 1.1, lightgbm 4.7, neuralforecast 3.2,
# torch 2.14 (CUDA 12.6), Python 3.10.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",          # groupby.apply(include_groups=...) in the M5 loader
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "statsforecast>=2.0",
    "mlforecast>=1.0",
    "lightgbm>=4.0",
    "pyarrow>=14",          # forecast files (parquet)
]

[project.optional-dependencies]
# Deep models (N-BEATS, NHITS, TFT, BiTCN, DeepAR) and Chronos-2. Install torch first from
# https://pytorch.org for a CUDA build; the default wheel is CPU-only and ~15x
# slower for these models.
neural = [
    "torch>=2.4",
    "neuralforecast>=3.0",
    "chronos-forecasting>=2.3",
]
# The other boosted-tree libraries; LightGBM is a core dependency.
trees = [
    "xgboost>=3.0",
    "catboost>=1.2",
]
data = [
    "kaggle",
]
# Figures (scripts/make_figures.py) and the notebooks.
viz = [
    "matplotlib>=3.8",
    "jupyter",
]
dev = [
    "pytest",
    "ruff",
    "matplotlib>=3.8",      # the figure tests draw every README chart
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Notebooks put sys.path set-up before their imports.
"notebooks/*" = ["E402"]
